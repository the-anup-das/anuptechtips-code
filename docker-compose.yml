# Local test services for the "Reliable Python services" posts on anuptechtips.com.
# docker compose up -d   then   docker compose down -v
name: reliable-python-patterns
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
      POSTGRES_DB: patterns
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB"]
    ports: ["55432:5432"]
  redis:
    image: redis:8
    ports: ["56379:6379"]
  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:59092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["59092:59092"]
